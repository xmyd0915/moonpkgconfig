name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain version
        run: moon version --all

      - name: Download dependencies
        run: moon update

      - name: Check formatting
        shell: bash
        run: |
          moon fmt
          git diff --exit-code

      - name: Type-check all targets
        run: moon check --target all --deny-warn

      - name: Test all targets
        run: moon test --target all --deny-warn

      - name: Check publish package contents
        shell: bash
        run: |
          package_files="$(moon package --list 2>&1)"
          listed_files="$(grep -vE '^(Running moon check|Finished\.|Check passed|Package to )' <<< "$package_files")"
          grep -qx "README.md" <<< "$listed_files"
          grep -qx "LICENSE" <<< "$listed_files"
          grep -qx "ORIGINS.md" <<< "$listed_files"
          grep -qx "parser.mbt" <<< "$listed_files"
          grep -qx "flags.mbt" <<< "$listed_files"
          ! grep -Eq '(^|[/\\])(_build|\.tools)([/\\]|$)|credentials\.json' <<< "$listed_files"

      - name: Run library API demo
        run: moon run cmd/demo

      - name: Run valid file demo
        run: moon run --target native cmd/inspect examples/valid/imagekit.pc

      - name: Verify diagnostic exit code
        shell: bash
        run: |
          set +e
          moon run --target native cmd/inspect examples/invalid/broken.pc
          status=$?
          set -e
          test "$status" -eq 1

      - name: Run dependency queries
        shell: bash
        run: |
          test "$(moon run --target native cmd/query examples/valid imagekit --cflags)" = "-I/opt/example/include -DIMAGEKIT=1 -I/opt/example/include/codec -I/opt/example/include/compression"
          moon run --target native cmd/query examples/valid imagekit --cflags --explain | grep -q "via imagekit -> compression"
          test "$(moon run --target native cmd/query examples/valid imagekit --libs)" = "-L/opt/example/lib -limagekit -L/opt/example/lib -lcodec -L/opt/example/lib -lcompression"
          test "$(moon run --target native cmd/query examples/valid imagekit --libs --static)" = "-L/opt/example/lib -limagekit -lm -L/opt/example/lib -lcodec -L/opt/example/lib -lcompression -lz"
          test "$(moon run --target native cmd/query examples/valid imagekit --libs --dedupe-paths)" = "-L/opt/example/lib -limagekit -lcodec -lcompression"
          test "$(moon run --target native cmd/query testdata/pkgconf-3.0.7 fragment-quoting --cflags)" = "-fPIC -I/test/include/foo '-DQUOTED=\"/test/share/doc\"'"
          test "$(moon run --target native cmd/query examples/order root --cflags)" = "-I/root -I/left -I/right -I/common"
          test "$(moon run --target native cmd/query examples/order root --libs --static)" = "-lroot -lroot-private -lleft -lright -lcommon"
          test "$(moon run --target native cmd/query examples/mixed good --cflags)" = "-I/good"
          set +e
          broken_output="$(moon run --target native cmd/query examples/mixed broken --cflags)"
          broken_status=$?
          set -e
          test "$broken_status" -eq 1
          grep -q "PC004" <<< "$broken_output"
          set +e
          broken_json="$(moon run --target native cmd/query examples/mixed broken --cflags --json)"
          broken_json_status=$?
          set -e
          test "$broken_json_status" -eq 1
          test "$(printf '%s' "$broken_json" | head -c 1)" = "{"
          grep -q '"flags": \[\]' <<< "$broken_json"
          grep -q '"code": "PC004"' <<< "$broken_json"
          test "$(moon run --target native cmd/query examples/search/first demo --path examples/search/second --cflags)" = "-I/first -I/helper"
          test "$(moon run --target native cmd/query examples/search/second demo --path examples/search/first --cflags)" = "-I/second"
          test "$(moon run --target native cmd/query examples/valid imagekit --modversion)" = "1.2.0"
          test "$(moon run --target native cmd/query examples/valid imagekit --variable=prefix)" = "/opt/example"
          test "$(moon run --target native cmd/query examples/valid imagekit --variable=prefix --define-variable=prefix=/custom)" = "/custom"
          test "$(moon run --target native cmd/query examples/valid imagekit --cflags --define-variable=prefix=/custom)" = "-I/custom/include -DIMAGEKIT=1 -I/custom/include/codec -I/custom/include/compression"
          test "$(moon run --target native cmd/query examples/path-policy paths --cflags --system-include-path=/usr/include)" = "-I/opt/include -isystem /usr/include/system -DKEEP=1"
          test "$(moon run --target native cmd/query examples/path-policy paths --libs --system-library-path=/usr/lib)" = "-L/opt/lib -lpaths"
          test "$(moon run --target native cmd/query examples/path-policy paths --cflags --sysroot=/sdk)" = "-I/sdk/usr/include -I/sdk/opt/include -isystem /sdk/usr/include/system -DKEEP=1"
          test "$(moon run --target native cmd/query examples/path-policy paths --libs --sysroot=/sdk)" = "-L/sdk/usr/lib -L/sdk/opt/lib -lpaths"
          moon run --target native cmd/query examples/valid imagekit --exists
          moon run --target native cmd/query examples/valid imagekit --atleast-version=1.1
          moon run --target native cmd/query examples/valid imagekit --exact-version=1.2.0
          set +e
          moon run --target native cmd/query examples/valid imagekit --max-version=1.1
          version_status=$?
          set -e
          test "$version_status" -eq 1

      - name: Check package directories
        shell: bash
        run: |
          test "$(moon run --target native cmd/check examples/valid)" = "Checked 3 packages from 3 .pc files; 0 diagnostics."
          test "$(moon run --target native cmd/check testdata/pkgconf-3.0.7)" = "Checked 10 packages from 10 .pc files; 0 diagnostics."
          test "$(moon run --target native cmd/check testdata/real-world)" = "Checked 2 packages from 2 .pc files; 0 diagnostics."
          set +e
          output="$(moon run --target native cmd/check examples/invalid)"
          status=$?
          set -e
          test "$status" -eq 1
          grep -q "package-that-is-not-here" <<< "$output"
          grep -q "private-helper" <<< "$output"
          grep -q "4 diagnostics." <<< "$output"

      - name: Build and run native C/C++ example
        run: sh scripts/verify-native-example.sh

      - name: Build pinned pkgconf 3.0.7 reference
        shell: bash
        run: |
          archive="$RUNNER_TEMP/pkgconf-3.0.7.tar.xz"
          source_dir="$RUNNER_TEMP/pkgconf-3.0.7"
          install_dir="$RUNNER_TEMP/pkgconf-3.0.7-install"
          curl -fsSL --retry 3 -o "$archive" https://github.com/pkgconf/pkgconf/releases/download/pkgconf-3.0.7/pkgconf-3.0.7.tar.xz
          echo "c926ff491cbd9a331a589160811bd97ab1749b4d5198a519338f2cdfabe6940a  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          cd "$source_dir"
          ./configure --prefix="$install_dir"
          make -j2
          make install
          echo "PKGCONF=$install_dir/bin/pkgconf" >> "$GITHUB_ENV"
          "$install_dir/bin/pkgconf" --version

      - name: Compare supported queries with pkgconf
        run: sh scripts/compare-pkgconf.sh
